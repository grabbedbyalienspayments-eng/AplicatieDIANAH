<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>WebsiteON — Call Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:        #0a0a0f;
  --surface:   #13131a;
  --surface2:  #1c1c28;
  --border:    #2a2a3d;
  --accent:    #6c63ff;
  --accent2:   #ff6584;
  --green:     #22c55e;
  --red:       #ef4444;
  --yellow:    #f59e0b;
  --blue:      #3b82f6;
  --text:      #e8e8f0;
  --muted:     #6060a0;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ═══════════════════════════════════════════
   BASE
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', sans-serif;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ═══════════════════════════════════════════
   TOP BAR
═══════════════════════════════════════════ */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.logo {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-transform: uppercase;
  white-space: nowrap;
}
.progress-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.progress-bar {
  flex: 1;
  height: 5px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.4s ease;
}
.progress-label {
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  color: var(--muted);
  white-space: nowrap;
}
.export-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Sora', sans-serif;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  -webkit-appearance: none;
}
.export-btn:hover, .export-btn:active { border-color: var(--accent); color: var(--accent); }

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
.main {
  max-width: 680px;
  margin: 0 auto;
  padding: 14px 14px calc(14px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ═══════════════════════════════════════════
   FIRM CARD
═══════════════════════════════════════════ */
.firm-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.firm-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}
.firm-badge {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.firm-index {
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  color: var(--muted);
}
.firm-type-tag {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--accent);
  background: var(--accent)15;
  border: 1px solid var(--accent)30;
  padding: 2px 8px;
  border-radius: 99px;
}
.firm-name {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 12px;
}
.firm-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 14px;
}
.tag {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 12px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  transition: all 0.15s;
  -webkit-appearance: none;
}
.tag.rating  { color: var(--yellow); border-color: #f59e0b25; background: #f59e0b08; }
.tag.phone   { color: var(--green);  border-color: #22c55e25; background: #22c55e08; cursor: pointer; }
.tag.website { color: var(--blue);   border-color: #3b82f625; background: #3b82f608; cursor: pointer; }
.tag.maps    { color: #e8e8f0;       border-color: #ffffff15; background: #ffffff05; cursor: pointer; }
.tag.phone:active, .tag.website:active, .tag.maps:active { opacity: 0.7; }

/* ═══════════════════════════════════════════
   OBSERVATII
═══════════════════════════════════════════ */
.obs-box {
  background: var(--surface2);
  border: 1px solid var(--accent)25;
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 12px 14px;
}
.obs-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}
.obs-text {
  font-size: 14px;
  line-height: 1.7;
  color: #cccce0;
  white-space: pre-line;
}

/* ═══════════════════════════════════════════
   SCRIPT
═══════════════════════════════════════════ */
.script-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}
.script-header {
  padding: 12px 16px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.script-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.scroll-hint {
  font-size: 10px;
  color: var(--muted);
  opacity: 0.6;
}

/* Script is NOT height-limited on mobile — full scroll of page is better UX */
.script-body {
  padding: 16px;
}

.section { margin-bottom: 20px; }
.section:last-child { margin-bottom: 0; }

.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.script-line {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text);
  margin-bottom: 8px;
}
.script-line strong { color: #fff; font-weight: 600; }

.highlight-box {
  background: linear-gradient(90deg, var(--accent)12, transparent);
  border-left: 3px solid var(--accent);
  padding: 10px 14px;
  border-radius: 0 10px 10px 0;
  margin-bottom: 10px;
  font-size: 15px;
  line-height: 1.8;
  color: var(--text);
}
.highlight-box strong { color: #fff; }

.reviews-pill {
  display: inline-block;
  background: var(--yellow)20;
  border: 1px solid var(--yellow)40;
  color: var(--yellow);
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 99px;
  font-size: 14px;
}

.list-item {
  font-size: 14px;
  line-height: 1.7;
  color: #cccce0;
  padding-left: 18px;
  position: relative;
  margin-bottom: 5px;
}
.list-item::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--accent);
  font-weight: 700;
}

.obs-in-script {
  margin: 10px 0 14px;
}
.obs-in-script-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent2);
  margin-bottom: 6px;
}

/* Prices */
.prices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 10px 0;
}
.price-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}
.price-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.price-val { font-size: 16px; font-weight: 700; color: #fff; font-family: 'DM Mono', monospace; }

/* Modificari */
.modif-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 8px 0;
}
.modif-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.modif-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.modif-val { font-size: 14px; font-weight: 700; color: #fff; font-family: 'DM Mono', monospace; }
.modif-sub { font-size: 9px; color: var(--muted); margin-top: 2px; }

/* Objections */
.objection {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.objection-q {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent2);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.objection-a {
  font-size: 14px;
  line-height: 1.7;
  color: #cccce0;
}

/* ═══════════════════════════════════════════
   STATUS + NOTES
═══════════════════════════════════════════ */
.status-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
}
.section-header-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 12px;
}
.status-btn {
  padding: 14px 8px;
  border-radius: 12px;
  border: 2px solid var(--border);
  font-family: 'Sora', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--surface2);
  color: var(--muted);
  -webkit-appearance: none;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  min-height: 52px; /* touch target */
}
.status-btn:active { transform: scale(0.96); }
.s-interesat.active    { background: #22c55e12; border-color: var(--green);  color: var(--green); }
.s-nu-raspuns.active   { background: #f59e0b12; border-color: var(--yellow); color: var(--yellow); }
.s-nu-interesat.active { background: #ef444412; border-color: var(--red);    color: var(--red); }
.s-resunat.active      { background: #3b82f612; border-color: var(--blue);   color: var(--blue); }

.notes-area {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 14px;
  resize: none;
  min-height: 68px;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.notes-area:focus { border-color: var(--accent); }
.notes-area::placeholder { color: var(--muted); }

/* ═══════════════════════════════════════════
   NAV
═══════════════════════════════════════════ */
.nav-section {
  display: flex;
  gap: 10px;
  padding-bottom: var(--safe-bottom);
}
.nav-btn {
  flex: 1;
  padding: 16px;
  border-radius: 14px;
  border: none;
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 56px;
  touch-action: manipulation;
  -webkit-appearance: none;
  user-select: none;
}
.nav-btn:active { transform: scale(0.97); }
.nav-prev {
  background: var(--surface2);
  color: var(--muted);
  border: 1.5px solid var(--border);
  max-width: 120px;
}
.nav-prev:hover { color: var(--text); }
.nav-next {
  background: linear-gradient(135deg, var(--accent) 0%, #9c8cff 100%);
  color: #fff;
  box-shadow: 0 4px 20px var(--accent)40;
}
.nav-next:hover { box-shadow: 0 6px 28px var(--accent)55; }
.nav-next:active { box-shadow: 0 2px 12px var(--accent)30; }

/* ═══════════════════════════════════════════
   DONE SCREEN
═══════════════════════════════════════════ */
.done-screen {
  display: none;
  text-align: center;
  padding: 60px 20px;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  min-height: 80dvh;
  justify-content: center;
}
.done-screen.show { display: flex; }
.done-emoji { font-size: 60px; }
.done-title { font-size: 24px; font-weight: 700; }
.done-sub { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 280px; }
.done-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 6px 0;
}
.stat-chip {
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  border: 1.5px solid;
}
.done-export-btn {
  background: linear-gradient(135deg, var(--accent), #9c8cff);
  color: #fff;
  border: none;
  padding: 16px 32px;
  border-radius: 14px;
  font-family: 'Sora', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  box-shadow: 0 4px 20px var(--accent)40;
  -webkit-appearance: none;
  min-height: 56px;
}
.done-back-btn {
  background: var(--surface2);
  color: var(--muted);
  border: 1.5px solid var(--border);
  padding: 12px 24px;
  border-radius: 12px;
  font-family: 'Sora', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  -webkit-appearance: none;
}

/* ═══════════════════════════════════════════
   MOBILE OVERRIDES
═══════════════════════════════════════════ */
@media (max-width: 420px) {
  .firm-name { font-size: 18px; }
  .script-line, .highlight-box { font-size: 14px; }
  .objection-a { font-size: 13px; }
  .list-item { font-size: 13px; }
  .prices-grid { grid-template-columns: 1fr 1fr; }
  .modif-grid { grid-template-columns: repeat(3, 1fr); }
  .nav-prev { max-width: 100px; font-size: 13px; }
  .status-btn { font-size: 12px; padding: 12px 6px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">WebsiteON</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">1 / 52</div>
  </div>
  <button class="export-btn" onclick="exportCSV()">⬇ CSV</button>
</div>

<!-- MAIN CONTENT -->
<div class="main" id="mainContent">

  <!-- 1. FIRM CARD -->
  <div class="firm-card">
    <div class="firm-badge">
      <div class="firm-index" id="firmIndex">Firmă #1</div>
      <div class="firm-type-tag" id="firmType"></div>
    </div>
    <div class="firm-name" id="firmName"></div>
    <div class="firm-meta" id="firmMeta"></div>
    <div class="obs-box">
      <div class="obs-label">👁 Observații website</div>
      <div class="obs-text" id="firmObs"></div>
    </div>
  </div>

  <!-- 2. SCRIPT -->
  <div class="script-container">
    <div class="script-header">
      <div class="script-title">📞 Script apel</div>
      <div class="scroll-hint">↕ derulează</div>
    </div>
    <div class="script-body" id="scriptContent"></div>
  </div>

  <!-- 3. STATUS + NOTES -->
  <div class="status-section">
    <div class="section-header-label">Rezultat apel</div>
    <div class="status-grid">
      <button class="status-btn s-interesat"    onclick="setStatus('interesat')"    id="btn-interesat">✅ Interesat</button>
      <button class="status-btn s-nu-raspuns"   onclick="setStatus('nu-raspuns')"   id="btn-nu-raspuns">📵 Nu a răspuns</button>
      <button class="status-btn s-nu-interesat" onclick="setStatus('nu-interesat')" id="btn-nu-interesat">❌ Nu e interesat</button>
      <button class="status-btn s-resunat"      onclick="setStatus('resunat')"      id="btn-resunat">🔄 Resunat mai târziu</button>
    </div>
    <textarea class="notes-area" id="notesArea" placeholder="Notițe rapide (număr WA, email, feedback)…" rows="3" oninput="saveNote()"></textarea>
  </div>

  <!-- 4. NAV -->
  <div class="nav-section">
    <button class="nav-btn nav-prev" onclick="navigate(-1)" id="prevBtn">← Înapoi</button>
    <button class="nav-btn nav-next" onclick="navigate(1)"  id="nextBtn">Următor →</button>
  </div>

</div>

<!-- DONE SCREEN -->
<div class="done-screen" id="doneScreen">
  <div class="done-emoji">🎉</div>
  <div class="done-title">Lista finalizată!</div>
  <div class="done-stats" id="doneStats"></div>
  <div class="done-sub">Descarcă CSV-ul pentru a vedea toate rezultatele organizat.</div>
  <button class="done-export-btn" onclick="exportCSV()">⬇ Descarcă CSV rezultate</button>
  <button class="done-back-btn" onclick="goBack()">← Înapoi la lista</button>
</div>

/* ─────────────────────────────────────────
   STATE
───────────────────────────────────────── */
let current = 0;
let results = FIRMS.map(() => ({ status: '', notes: '' }));

// Restore from sessionStorage
try {
  const sr = sessionStorage.getItem('wson_r');
  const si = sessionStorage.getItem('wson_i');
  if (sr) results = JSON.parse(sr);
  if (si) current = Math.min(parseInt(si), FIRMS.length - 1);
} catch(e) {}

/* ─────────────────────────────────────────
   SAVE
───────────────────────────────────────── */
function save() {
  try {
    sessionStorage.setItem('wson_r', JSON.stringify(results));
    sessionStorage.setItem('wson_i', current);
  } catch(e) {}
}

/* ─────────────────────────────────────────
   STATUS
───────────────────────────────────────── */
function setStatus(s) {
  // Toggle off if same
  results[current].status = results[current].status === s ? '' : s;
  save();
  renderStatusBtns();
}

function saveNote() {
  results[current].notes = document.getElementById('notesArea').value;
  save();
}

/* ─────────────────────────────────────────
   NAVIGATE
───────────────────────────────────────── */
function navigate(dir) {
  if (dir > 0 && current === FIRMS.length - 1) {
    showDone();
    return;
  }
  current = Math.max(0, Math.min(FIRMS.length - 1, current + dir));
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  document.getElementById('doneScreen').classList.remove('show');
  document.getElementById('mainContent').style.display = '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showDone() {
  document.getElementById('mainContent').style.display = 'none';
  const ds = document.getElementById('doneScreen');
  ds.classList.add('show');

  const counts = {
    interesat: results.filter(r => r.status === 'interesat').length,
    'nu-raspuns': results.filter(r => r.status === 'nu-raspuns').length,
    'nu-interesat': results.filter(r => r.status === 'nu-interesat').length,
    resunat: results.filter(r => r.status === 'resunat').length,
    nesunat: results.filter(r => !r.status).length,
  };

  document.getElementById('doneStats').innerHTML = `
    <div class="stat-chip" style="color:var(--green);border-color:var(--green)30;background:var(--green)10">✅ ${counts.interesat} interesați</div>
    <div class="stat-chip" style="color:var(--yellow);border-color:var(--yellow)30;background:var(--yellow)10">📵 ${counts['nu-raspuns']} nu au răspuns</div>
    <div class="stat-chip" style="color:var(--red);border-color:var(--red)30;background:var(--red)10">❌ ${counts['nu-interesat']} nu sunt interesați</div>
    <div class="stat-chip" style="color:var(--blue);border-color:var(--blue)30;background:var(--blue)10">🔄 ${counts.resunat} de resunat</div>
    ${counts.nesunat > 0 ? `<div class="stat-chip" style="color:var(--muted);border-color:var(--border)">⏳ ${counts.nesunat} nesunate</div>` : ''}
  `;
}

/* ─────────────────────────────────────────
   RENDER STATUS BUTTONS
───────────────────────────────────────── */
function renderStatusBtns() {
  const s = results[current].status;
  ['interesat','nu-raspuns','nu-interesat','resunat'].forEach(id => {
    const el = document.getElementById('btn-' + id);
    if (s === id) el.classList.add('active');
    else el.classList.remove('active');
  });
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─────────────────────────────────────────

───────────────────────────────────────── */
function render() {
  const firm = FIRMS[current];
  const total = FIRMS.length;

  // Progress
  document.getElementById('progressFill').style.width = ((current + 1) / total * 100) + '%';
  document.getElementById('progressLabel').textContent = `${current + 1} / ${total}`;

  // Firm card
  document.getElementById('firmIndex').textContent = `Firmă #${current + 1}`;
  document.getElementById('firmType').textContent = firm.type || '';
  document.getElementById('firmName').textContent = firm.name;

  // Meta
  const meta = document.getElementById('firmMeta');
  let metaHtml = `<div class="tag rating">⭐ ${firm.rating} · ${firm.reviews} recenzii</div>`;
  if (firm.phone) metaHtml += `<a href="tel:${esc(firm.phone)}" class="tag phone">📞 ${esc(firm.phone)}</a>`;
  if (firm.website) metaHtml += `<a href="${esc(firm.website)}" target="_blank" rel="noopener" class="tag website">🌐 Website</a>`;
  if (firm.mapsUrl) metaHtml += `<a href="${esc(firm.mapsUrl)}" target="_blank" rel="noopener" class="tag maps">📍 Maps</a>`;
  meta.innerHTML = metaHtml;

  // Obs
  document.getElementById('firmObs').textContent = firm.obs;

  // Script
  document.getElementById('scriptContent').innerHTML = buildScript(firm);

  // Status buttons
  renderStatusBtns();

  // Notes
  document.getElementById('notesArea').value = results[current].notes || '';

  // Prev button
  const prevBtn = document.getElementById('prevBtn');
  prevBtn.style.opacity = current === 0 ? '0.35' : '1';
  prevBtn.disabled = current === 0;

  // Next button
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === total - 1 ? '✓ Finalizat' : 'Următor →';
}

/* ─────────────────────────────────────────
   EXPORT CSV
───────────────────────────────────────── */
function exportCSV() {
  const headers = ['Nr','Firma','Telefon','Rating','Recenzii','Adresa','Website','Status','Notite'];
  const rows = FIRMS.map((f, i) => [
    i + 1,
    `"${(f.name || '').replace(/"/g, '""')}"`,
    f.phone || '',
    f.rating || '',
    f.reviews || '',
    `"${(f.address || '').replace(/"/g, '""')}"`,
    f.website || '',
    results[i].status || 'nesunat',
    `"${(results[i].notes || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`
  ]);

  const csv = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `websiteon-apeluri-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
render();
